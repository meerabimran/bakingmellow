<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up - Baking Mellow</title>
  <style>
    body { background-color: #fff8f0; font-family: Georgia, serif; text-align: center; margin: 0; padding: 20px; }
    h1 { color:#5C4033; }
    form { background-color: #D2B48C; width: 300px; margin: auto; padding: 30px 50px; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    label { font-weight: bold; color:#5C4033; display: block; text-align: left; margin-top: 15px; }
    input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
    input[type="submit"] { background-color:#5C4033; color: white; border: none; margin-top: 25px; cursor: pointer; font-size: 16px; font-weight: bold; }
    input[type="submit"]:hover { background-color: #3e2a22; }
    a { display: block; margin-top: 15px; text-decoration: none; color:#5C4033; font-size: 0.9em; }
    .navbar { margin-bottom: 20px; }
  </style>
</head>
<body>

<div class="navbar">
  <div class="nav-links">
    <a href="/home"> Back to Home</a>
  </div>
</div>

<h1>Welcome To Baking Mellow 🍩</h1>
<h3>Sign Up 👤</h3>

<form id="signupForm">
    <label>First Name:</label>
    <input type="text" id="firstname" placeholder="Enter first name" required>
    <label>Last Name:</label>
    <input type="text" id="lastname" placeholder="Enter last name" required>
    <label>Email:</label>
    <input type="email" id="email" placeholder="Enter email" required>
    <label>Password:</label>
    <input type="password" id="password" placeholder="Enter password" required>
    <input type="submit" value="SignUp">
    <a href="/login">Already have an account? Login here</a>
</form>

<footer>
  <p>📍 Sargodha, Pakistan</p>
  <p>📞 +92 3426275592 | 📧 bakingmellow@gmail.com</p>
  <p>© 2025 BakingMellow | Powered by MEERAB IMRAN</p>
</footer>

<script>
document.getElementById('signupForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const res = await fetch('/api/signup', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            firstname: document.getElementById('firstname').value,
            lastname: document.getElementById('lastname').value,
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
        })
    });
    const data = await res.json();
    if(data.success) { alert(data.message); window.location.href='/login'; }
    else { alert(data.error); }
});
</script>
</body>
</html>
