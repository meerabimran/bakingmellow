<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Your Cart - Baking Mellow</title>
<style>
  body { margin:0; font-family:Georgia, serif; background:#fff8f2; }
  .navbar { display:flex; justify-content:space-between; align-items:center; padding:14px 40px; background:#fff; box-shadow:0 2px 10px #00000015; position:sticky; top:0; z-index:1000; }
  .nav-left { display:flex; align-items:center; gap:22px; }
  .logo img { height:55px; }
  .nav-left a { text-decoration:none; color:#5c4636; font-size:17px; font-weight:bold; transition:0.3s; }
  .nav-left a:hover { color:#b69b72; }
  .nav-right { display:flex; align-items:center; gap:18px; font-size:22px; }
  .nav-right a { text-decoration:none; color:#5c4636; transition:0.3s; }
  .active { color:#b69b72; border-bottom:2px solid #b69b72; }
  h1 { text-align:center; margin:40px 0; color:#5c4636; }
  table { width:80%; margin:auto; border-collapse:collapse; background:#fff; box-shadow:0 5px 15px rgba(0,0,0,0.15); }
  th, td { padding:15px; text-align:center; border-bottom:1px solid #eee; }
  th { background:#b69b72; color:white; }
  .remove { color:red; cursor:pointer; font-weight:bold; font-size: 1.2em; }
  .total { width:80%; margin:30px auto; text-align:right; font-size:22px; color:#4b2e2e; font-weight: bold; }
  .checkout-btn { display:block; width:250px; margin:30px auto; padding:15px; background:#5c4636; color:white; text-align:center; text-decoration:none; border-radius:8px; border: none; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; }
  .checkout-btn:hover { background:#b69b72; }
  .checkout-btn:disabled { background: #ccc; cursor: not-allowed; }
</style>
</head>
<body>

<div class="navbar">
  <div class="nav-left">
    <a href="/home" class="logo"><img src="/logo.jpg" alt="BakingMellow"></a>
    <a href="/home">Home</a>
    <a href="/menu" class="active">Menu</a>
    <a href="/about">About Us</a>
    <a href="/social">Social Media</a>
    <a href="/contact">Contact Us</a>
  </div>
  <div class="nav-right">
    <a href="/signup" title="Sign Up">👤</a>
    <a href="/login" title="Login">🔑</a>
    <a href="/cart" title="Cart">🛒</a>
  </div>
</div>

<h1>🛒 Your Shopping Cart</h1>

<table>
  <thead>
    <tr><th>Product</th><th>Option</th><th>Qty</th><th>Price</th><th>Remove</th></tr>
  </thead>
  <tbody id="cartItems"></tbody>
</table>

<div class="total">Total: Rs <span id="totalPrice">0</span></div>
<button onclick="placeOrder()" id="orderBtn" class="checkout-btn">Confirm & Place Order</button>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];
let tbody = document.getElementById("cartItems");
let total = 0;

function displayCart() {
    tbody.innerHTML = "";
    total = 0;
    if(cart.length === 0){
        tbody.innerHTML = `<tr><td colspan="5">Your cart is empty 😢 <br><a href="/menu">Go to Menu</a></td></tr>`;
        document.getElementById("orderBtn").disabled = true;
    } else {
        cart.forEach((item, index) => {
            let row = document.createElement("tr");
            let itemTotal = item.price * item.qty;
            total += itemTotal;
            row.innerHTML = `
                <td>${item.name}</td>
                <td>${item.option}</td>
                <td>${item.qty}</td>
                <td>Rs ${itemTotal}</td>
                <td class="remove" onclick="removeItem(${index})">✖</td>
            `;
            tbody.appendChild(row);
        });
        document.getElementById("orderBtn").disabled = false;
    }
    document.getElementById("totalPrice").innerText = total;
}

function removeItem(index){
    cart.splice(index, 1);
    localStorage.setItem("cart", JSON.stringify(cart));
    displayCart();
}

async function placeOrder() {
    if (cart.length === 0) return;
    const user_id = localStorage.getItem('user_id');
    if(!user_id) { alert('Please login first!'); window.location.href='/login'; return; }
    const res = await fetch('/api/place-order', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ total: total })
    });
    const data = await res.json();
    if(data.success) { 
        alert("🍩 Order Placed! Your treats are being prepared.");
        localStorage.removeItem("cart");
        window.location.href = "/order_success";
    } else { alert(data.error); }
}
displayCart();
</script>
</body>
</html>
